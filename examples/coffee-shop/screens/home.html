<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ana sayfa</title>
<link rel="stylesheet" href="../shared/styles.css">
<script src="../shared/components.js"></script>
</head>
<body>
<div class="ekran">
  <kd-durum></kd-durum>

  <!-- Başlık -->
  <div class="a soluk row" style="left:20px;top:62px;height:20px;gap:6px;font-size:14px;font-weight:500">
    <kd-ikon ad="konum" style="width:15px;height:15px;color:var(--Vurgu)"></kd-ikon>Karaköy şubesi
  </div>
  <div class="a" style="left:20px;top:86px;font-size:28px;font-weight:750;letter-spacing:-.5px">Bugün ne içelim?</div>
  <div class="a yuvarlak ctr" data-hedef="cart" style="left:326px;top:72px">
    <kd-ikon ad="canta" style="width:22px;height:22px"></kd-ikon>
    <div class="a ctr" style="left:27px;top:-3px;width:20px;height:20px;border-radius:10px;background:var(--Vurgu);color:var(--VurguUstu);font-size:11px;font-weight:700">2</div>
  </div>

  <!-- Arama -->
  <div class="a panel row soluk" style="left:20px;top:140px;width:350px;height:50px;border-radius:16px;padding:0 16px;gap:10px;font-size:15px">
    <kd-ikon ad="arama" style="width:20px;height:20px"></kd-ikon>Kahve, tatlı ara…
  </div>

  <!-- Kategoriler -->
  <div class="a row" style="left:20px;top:206px;gap:8px">
    <div class="cip ctr secili">Hepsi</div>
    <div class="cip ctr">Sıcak</div>
    <div class="cip ctr">Soğuk</div>
    <div class="cip ctr">Tatlı</div>
    <div class="cip ctr">Çay</div>
  </div>

  <!-- Günün kahvesi -->
  <div class="a" data-hedef="product-detail" style="left:20px;top:262px;width:350px;height:156px;border-radius:24px;background:var(--Vurgu);color:var(--VurguUstu);overflow:hidden">
    <div class="a" style="left:196px;top:-40px;width:220px;height:220px;border-radius:110px;background:var(--VurguUstu);opacity:.12"></div>
    <div class="a etiket" style="left:20px;top:22px;opacity:.85">Günün kahvesi</div>
    <div class="a" style="left:20px;top:46px;font-size:24px;font-weight:750;letter-spacing:-.3px">Karamel Latte</div>
    <div class="a" style="left:20px;top:82px;width:190px;font-size:13px;line-height:18px;opacity:.85">14.00'e kadar %20 indirim</div>
    <div class="a ctr" style="left:20px;top:112px;height:28px;padding:0 12px;border-radius:14px;background:var(--VurguUstu);color:var(--Vurgu);font-size:13px;font-weight:700">₺116 <span style="margin-left:6px;text-decoration:line-through;opacity:.55;font-weight:600">₺145</span></div>
    <kd-fincan icecek="latte" boyut="132" class="a" style="left:208px;top:14px"></kd-fincan>
  </div>

  <!-- Popüler -->
  <div class="a baslik" style="left:20px;top:440px">Popüler</div>
  <div class="a" style="left:310px;top:444px;width:60px;text-align:right;font-size:14px;font-weight:600;color:var(--Vurgu)">Tümü</div>

  <div class="a panel row" data-hedef="product-detail" style="left:20px;top:478px;width:350px;height:80px;padding:0 14px 0 12px;gap:12px">
    <kd-fincan icecek="latte" boyut="56"></kd-fincan>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:650">Flat White</div>
      <div class="soluk" style="font-size:13px;margin-top:3px">Çift shot, ince köpük</div>
    </div>
    <div class="fiyat" style="font-size:16px">₺125</div>
    <div class="ekle ctr"><kd-ikon ad="arti" style="width:18px;height:18px"></kd-ikon></div>
  </div>
  <div class="a panel row" data-hedef="product-detail" style="left:20px;top:568px;width:350px;height:80px;padding:0 14px 0 12px;gap:12px">
    <kd-fincan icecek="matcha" boyut="56"></kd-fincan>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:650">Matcha Latte</div>
      <div class="soluk" style="font-size:13px;margin-top:3px">Matcha, yulaf sütü</div>
    </div>
    <div class="fiyat" style="font-size:16px">₺135</div>
    <div class="ekle ctr"><kd-ikon ad="arti" style="width:18px;height:18px"></kd-ikon></div>
  </div>
  <div class="a panel row" data-hedef="product-detail" style="left:20px;top:658px;width:350px;height:80px;padding:0 14px 0 12px;gap:12px">
    <kd-fincan icecek="espresso" boyut="56"></kd-fincan>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:650">Espresso</div>
      <div class="soluk" style="font-size:13px;margin-top:3px">Tek köken Etiyopya</div>
    </div>
    <div class="fiyat" style="font-size:16px">₺75</div>
    <div class="ekle ctr"><kd-ikon ad="arti" style="width:18px;height:18px"></kd-ikon></div>
  </div>

  <!-- Alt sekme çubuğu -->
  <div class="a row" style="left:0;top:760px;width:390px;height:84px;padding:10px 18px 0;align-items:flex-start;justify-content:space-around;background:var(--Panel);box-shadow:0 -1px 0 var(--Cizgi);font-size:11px;font-weight:600">
    <div class="ctr" style="flex-direction:column;gap:4px;width:64px;color:var(--Vurgu)"><kd-ikon ad="ev" style="width:24px;height:24px"></kd-ikon>Ana sayfa</div>
    <div class="ctr soluk" style="flex-direction:column;gap:4px;width:64px"><kd-ikon ad="fincan" style="width:24px;height:24px"></kd-ikon>Menü</div>
    <div class="ctr soluk" style="flex-direction:column;gap:4px;width:64px"><kd-ikon ad="fis" style="width:24px;height:24px"></kd-ikon>Siparişler</div>
    <div class="ctr soluk" style="flex-direction:column;gap:4px;width:64px"><kd-ikon ad="kisi" style="width:24px;height:24px"></kd-ikon>Profil</div>
  </div>
  <div class="a" style="left:128px;top:830px;width:134px;height:5px;border-radius:3px;background:var(--Yazi)"></div>
</div>
</body>
</html>
