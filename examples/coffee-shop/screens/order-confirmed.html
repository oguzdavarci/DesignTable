<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sipariş alındı</title>
<link rel="stylesheet" href="../shared/styles.css">
<script src="../shared/components.js"></script>
</head>
<body>
<div class="ekran">
  <kd-durum></kd-durum>

  <!-- Onay işareti -->
  <div class="a" style="left:115px;top:118px;width:160px;height:160px;border-radius:80px;background:color-mix(in srgb, var(--Vurgu) 14%, transparent)"></div>
  <div class="a ctr" style="left:135px;top:138px;width:120px;height:120px;border-radius:60px;background:var(--Vurgu);color:var(--VurguUstu)">
    <kd-ikon ad="tik" style="width:56px;height:56px;stroke-width:2.6"></kd-ikon>
  </div>

  <div class="a ctr" style="left:0;top:306px;width:390px;font-size:28px;font-weight:750;letter-spacing:-.5px">Siparişin alındı!</div>
  <div class="a ctr soluk" style="left:40px;top:348px;width:310px;font-size:15px;line-height:22px">Karaköy şubesinde hazırlanıyor. Hazır olunca bildirim göndereceğiz.</div>

  <!-- Sipariş bilgisi ve durum -->
  <div class="a panel" style="left:20px;top:428px;width:350px;height:212px">
    <div class="a" style="left:20px;top:18px">
      <div class="soluk" style="font-size:13px">Sipariş no</div>
      <div style="font-size:20px;font-weight:750;margin-top:4px">#4821</div>
    </div>
    <div class="a" style="left:190px;top:18px">
      <div class="soluk" style="font-size:13px">Tahmini süre</div>
      <div class="row" style="font-size:20px;font-weight:750;margin-top:4px;gap:6px"><kd-ikon ad="saat" style="width:20px;height:20px;color:var(--Vurgu)"></kd-ikon>~8 dk</div>
    </div>
    <div class="a" style="left:20px;top:86px;width:310px;height:1px;background:var(--Cizgi)"></div>

    <!-- Adımlar -->
    <div class="a" style="left:46px;top:128px;width:256px;height:4px;border-radius:2px;background:var(--PanelIkinci)"></div>
    <div class="a" style="left:46px;top:128px;width:128px;height:4px;border-radius:2px;background:var(--Vurgu)"></div>
    <div class="a ctr" style="left:32px;top:116px;width:28px;height:28px;border-radius:14px;background:var(--Vurgu);color:var(--VurguUstu)"><kd-ikon ad="tik" style="width:16px;height:16px;stroke-width:2.6"></kd-ikon></div>
    <div class="a ctr" style="left:160px;top:116px;width:28px;height:28px;border-radius:14px;background:var(--Panel);box-shadow:inset 0 0 0 3px var(--Vurgu)"><div style="width:10px;height:10px;border-radius:5px;background:var(--Vurgu)"></div></div>
    <div class="a" style="left:288px;top:116px;width:28px;height:28px;border-radius:14px;background:var(--PanelIkinci)"></div>
    <div class="a ctr" style="left:6px;top:156px;width:80px;font-size:13px;font-weight:600">Alındı</div>
    <div class="a ctr" style="left:134px;top:156px;width:80px;font-size:13px;font-weight:700;color:var(--Vurgu)">Hazırlanıyor</div>
    <div class="a ctr soluk" style="left:262px;top:156px;width:80px;font-size:13px;font-weight:600">Hazır</div>
  </div>

  <div class="a ctr buton ikincil" style="left:20px;top:692px;width:350px">Siparişi takip et</div>
  <div class="a ctr buton" data-hedef="home" style="left:20px;top:760px;width:350px">Ana sayfaya dön</div>
</div>
</body>
</html>
